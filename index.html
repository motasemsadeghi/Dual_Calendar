<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقویم دوگانه — Dual Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --surface: #191c27;
    --surface-2: #1f2330;
    --brass: #8a6d3b;
    --brass-bright: #d4af37;
    --ink: #ece6d6;
    --ink-dim: #9298a8;
    --ink-faint: #5b6070;
    --accent-cool: #6f95ab;
    --today-text: #1a1206;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 18px 64px;
    background-image:
      radial-gradient(circle at 18% 8%, rgba(212,175,55,0.05), transparent 40%),
      radial-gradient(circle at 82% 92%, rgba(111,149,171,0.06), transparent 45%);
  }

  .app {
    width: 100%;
    max-width: 440px;
  }

  .calendars {
    display: block;
  }

  .calendars > .panel {
    width: 100%;
  }

  .masthead {
    margin: 0 0 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(138,109,59,0.35);
    text-align: center;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
  }
  .masthead .fa { font-family: 'Vazirmatn', sans-serif; }
  .masthead .en { font-family: 'Inter', system-ui, sans-serif; }
  .masthead .mnum, .masthead .tr {
    color: var(--ink-dim);
    font-size: 0.9em;
  }
  .masthead .tr { font-style: italic; }
  .masthead .eq {
    color: var(--brass-bright);
    font-weight: 600;
    padding: 0 8px;
  }

  .panel {
    position: relative;
    background: var(--surface);
    border: 1px solid rgba(138,109,59,0.4);
    border-radius: var(--radius);
    padding: 20px 18px 16px;
    overflow: hidden;
  }

  .panel + .panel { margin-top: 0; }

  .rivet {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--brass);
    opacity: 0.55;
  }
  .rivet.tl{ top: 7px; left: 7px; }
  .rivet.tr{ top: 7px; right: 7px; }
  .rivet.bl{ bottom: 7px; left: 7px; }
  .rivet.br{ bottom: 7px; right: 7px; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .nav-btn {
    appearance: none;
    background: transparent;
    border: 1px solid rgba(138,109,59,0.5);
    color: var(--brass-bright);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .nav-btn:hover { background: rgba(212,175,55,0.1); border-color: var(--brass-bright); }
  .nav-btn:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
  .nav-btn svg { width: 14px; height: 14px; }

  .title-block { text-align: center; cursor: pointer; user-select: none; }
  .title-block .month {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    display: block;
  }
  .title-block .month-num {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-dim);
  }
  .panel[dir="rtl"] .title-block .month-num { font-family: 'Vazirmatn', sans-serif; }
  .title-block .month-tr {
    font-family: 'Inter', system-ui, sans-serif;
    font-style: italic;
    font-size: 12.5px;
    color: var(--accent-cool);
    display: block;
    margin-top: 1px;
  }
  .title-block .year {
    font-size: 12px;
    color: var(--ink-dim);
    display: block;
    margin-top: 1px;
  }
  .panel[dir="rtl"] .title-block .month,
  .panel[dir="rtl"] .title-block .year { font-family: 'Vazirmatn', sans-serif; }

  .weekday-row, .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .weekday-row {
    margin-bottom: 6px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(138,109,59,0.22);
  }
  .weekday-row span {
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .weekday-row span.weekend { color: var(--accent-cool); }

  .day-grid { min-height: 216px; }

  .day-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13.5px;
    color: var(--ink);
  }
  .panel[dir="rtl"] .day-cell { font-family: 'Vazirmatn', sans-serif; font-size: 13px; }

  .day-cell.empty { visibility: hidden; }
  .day-cell.weekend:not(.today) { color: var(--accent-cool); }

  .day-cell .num {
    position: relative;
    z-index: 1;
  }

  .day-cell.today .num {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--brass-bright);
    color: var(--today-text);
    border-radius: 50%;
    font-weight: 600;
    box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
  }

  .today-jump {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    font-family: inherit;
  }
  .panel[dir="rtl"] .today-jump { font-family: 'Vazirmatn', sans-serif; }
  .today-jump:hover { color: var(--brass-bright); }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
    color: var(--brass);
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(90deg, rgba(138,109,59,0.6) 0 4px, transparent 4px 9px);
  }
  .divider svg { flex: none; }

  .fade-slide {
    animation: fadeSlide 0.22s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade-slide { animation: none; }
  }

  .footer {
    text-align: center;
    margin: 22px 0 0;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
  }

  @media (max-width: 380px) {
    .day-cell { font-size: 12.5px; }
    .day-cell.today .num { width: 25px; height: 25px; }
  }
</style>
</head>
<body>

<div class="app">

  <p class="masthead" id="mastheadLine" dir="ltr"></p>

  <div class="calendars">

  <!-- Gregorian panel -->
  <div class="panel" dir="ltr" id="gregPanel">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="panel-header">
      <button class="nav-btn" id="gregPrev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-block" id="gregTitle"></div>
      <button class="nav-btn" id="gregNext" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="weekday-row" id="gregWeekdays"></div>
    <div class="day-grid fade-slide" id="gregGrid"></div>
    <button class="today-jump" id="gregToday">Today</button>
  </div>

  <div class="divider">
    <span class="line"></span>
    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" stroke="#8a6d3b" stroke-width="1" fill="none"/></svg>
    <span class="line"></span>
  </div>

  <!-- Persian / Jalali panel -->
  <div class="panel" dir="rtl" id="persPanel" lang="fa">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="panel-header">
      <button class="nav-btn" id="persPrev" aria-label="ماه بعد">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="title-block" id="persTitle"></div>
      <button class="nav-btn" id="persNext" aria-label="ماه قبل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="weekday-row" id="persWeekdays"></div>
    <div class="day-grid fade-slide" id="persGrid"></div>
    <button class="today-jump" id="persToday">امروز</button>
  </div>

  </div>

  <p class="footer" dir="rtl"><span dir="rtl">ایده: معتصم صادقی</span> - <span dir="rtl">اجرا: Claude</span></p>

</div>

<script>
/* ---------- Jalali <-> Gregorian conversion (public algorithm, jalaali-js style) ---------- */
function jdiv(a, b) { return Math.trunc(a / b); }
function jmod(a, b) { return a - Math.trunc(a / b) * b; }

function jalCal(jy) {
  var breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  var bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump = 0;
  for (var i = 1; i < bl; i++) {
    jm = breaks[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += jdiv(jump, 33) * 8 + jdiv(jmod(jump, 33), 4);
    jp = jm;
  }
  var n = jy - jp;
  leapJ += jdiv(n, 33) * 8 + jdiv(jmod(n, 33) + 3, 4);
  if (jmod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  var leapG = jdiv(gy, 4) - jdiv((jdiv(gy, 100) + 1) * 3, 4) - 150;
  var march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + jdiv(jump, 33) * 33;
  var leap = jmod(jmod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap: leap, gy: gy, march: march };
}

function g2d(gy, gm, gd) {
  var d = jdiv((gy + jdiv(gm - 8, 6) + 100100) * 1461, 4) + jdiv(153 * jmod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - jdiv(jdiv(gy + 100100 + jdiv(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn) {
  var j = 4 * jdn + 139361631;
  j = j + jdiv(jdiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  var i = jdiv(jmod(j, 1461), 4) * 5 + 308;
  var gd = jdiv(jmod(i, 153), 5) + 1;
  var gm = jmod(jdiv(i, 153), 12) + 1;
  var gy = jdiv(j, 1461) - 100100 + jdiv(8 - gm, 6);
  return { gy: gy, gm: gm, gd: gd };
}

function j2d(jy, jm, jd) {
  var r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jdiv(jm, 7) * (jm - 7) + jd - 1;
}

function d2j(jdn) {
  var gy = d2g(jdn).gy, jy = gy - 621;
  var r = jalCal(jy);
  var jdn1f = g2d(gy, 3, r.march);
  var k = jdn - jdn1f, jm, jd;
  if (k >= 0) {
    if (k <= 185) { jm = 1 + jdiv(k, 31); jd = jmod(k, 31) + 1; return { jy: jy, jm: jm, jd: jd }; }
    k -= 186;
  } else {
    jy -= 1; k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + jdiv(k, 30);
  jd = jmod(k, 30) + 1;
  return { jy: jy, jm: jm, jd: jd };
}

function toJalaali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }
function toGregorian(jy, jm, jd) { return d2g(j2d(jy, jm, jd)); }
function isLeapJalaaliYear(jy) { return jalCal(jy).leap === 0; }
var PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toPersianDigits(n) {
  return String(n).replace(/[0-9]/g, function (d) { return PERSIAN_DIGITS[d]; });
}
function jalaaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaaliYear(jy) ? 30 : 29;
}

/* ---------- App state ---------- */
var today = new Date();
today.setHours(0,0,0,0);
var todayG = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
var todayJ = toJalaali(todayG.y, todayG.m + 1, todayG.d);

var gregView = { y: todayG.y, m: todayG.m };
var persView = { jy: todayJ.jy, jm: todayJ.jm };

var GREG_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var GREG_MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GREG_WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var PERS_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var PERS_WD = ['ش','ی','د','س','چ','پ','ج'];

/* ---------- Rendering ---------- */
function renderGreg() {
  var y = gregView.y, m = gregView.m;
  document.getElementById('gregTitle').innerHTML =
    '<span class="month">' + GREG_MONTHS[m] + ' <span class="month-num">(' + (m + 1) + ')</span></span>' +
    '<span class="month-tr">' + GREG_MONTHS_TR[m] + '</span>' +
    '<span class="year">' + y + '</span>';

  var wdRow = document.getElementById('gregWeekdays');
  wdRow.innerHTML = GREG_WD.map(function(w, i) {
    var cls = (i === 5 || i === 6) ? ' weekend' : '';
    return '<span class="' + cls.trim() + '">' + w + '</span>';
  }).join('');

  var firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // 0 = Monday
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var cells = [];
  for (var i = 0; i < firstDow; i++) cells.push('<div class="day-cell empty"></div>');
  for (var d = 1; d <= daysInMonth; d++) {
    var dow = (firstDow + d - 1) % 7;
    var isToday = (y === todayG.y && m === todayG.m && d === todayG.d);
    var cls = 'day-cell' + ((dow === 5 || dow === 6) ? ' weekend' : '') + (isToday ? ' today' : '');
    cells.push('<div class="' + cls + '"><span class="num">' + d + '</span></div>');
  }
  var grid = document.getElementById('gregGrid');
  grid.innerHTML = cells.join('');
  grid.classList.remove('fade-slide'); void grid.offsetWidth; grid.classList.add('fade-slide');
}

function renderPers() {
  var jy = persView.jy, jm = persView.jm;
  document.getElementById('persTitle').innerHTML =
    '<span class="month">' + PERS_MONTHS[jm - 1] + ' <span class="month-num">(' + toPersianDigits(jm) + ')</span></span><span class="year">' + toPersianDigits(jy) + '</span>';

  var wdRow = document.getElementById('persWeekdays');
  wdRow.innerHTML = PERS_WD.map(function(w, i) {
    var cls = (i === 5 || i === 6) ? ' weekend' : ''; // Thursday & Friday
    return '<span class="' + cls.trim() + '">' + w + '</span>';
  }).join('');

  var firstGreg = toGregorian(jy, jm, 1);
  var firstJsDow = new Date(firstGreg.gy, firstGreg.gm - 1, firstGreg.gd).getDay();
  var firstDow = (firstJsDow + 1) % 7; // 0 = Saturday
  var daysInMonth = jalaaliMonthLength(jy, jm);

  var cells = [];
  for (var i = 0; i < firstDow; i++) cells.push('<div class="day-cell empty"></div>');
  for (var d = 1; d <= daysInMonth; d++) {
    var dow = (firstDow + d - 1) % 7;
    var isToday = (jy === todayJ.jy && jm === todayJ.jm && d === todayJ.jd);
    var cls = 'day-cell' + ((dow === 5 || dow === 6) ? ' weekend' : '') + (isToday ? ' today' : '');
    cells.push('<div class="' + cls + '"><span class="num">' + toPersianDigits(d) + '</span></div>');
  }
  var grid = document.getElementById('persGrid');
  grid.innerHTML = cells.join('');
  grid.classList.remove('fade-slide'); void grid.offsetWidth; grid.classList.add('fade-slide');
}

/* ---------- Navigation ---------- */
document.getElementById('gregPrev').addEventListener('click', function () {
  gregView.m--;
  if (gregView.m < 0) { gregView.m = 11; gregView.y--; }
  renderGreg();
});
document.getElementById('gregNext').addEventListener('click', function () {
  gregView.m++;
  if (gregView.m > 11) { gregView.m = 0; gregView.y++; }
  renderGreg();
});
document.getElementById('gregToday').addEventListener('click', function () {
  gregView.y = todayG.y; gregView.m = todayG.m;
  renderGreg();
});

document.getElementById('persPrev').addEventListener('click', function () {
  persView.jm--;
  if (persView.jm < 1) { persView.jm = 12; persView.jy--; }
  renderPers();
});
document.getElementById('persNext').addEventListener('click', function () {
  persView.jm++;
  if (persView.jm > 12) { persView.jm = 1; persView.jy++; }
  renderPers();
});
document.getElementById('persToday').addEventListener('click', function () {
  persView.jy = todayJ.jy; persView.jm = todayJ.jm;
  renderPers();
});

var PERS_WD_FULL = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var GREG_WD_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var GREG_WD_FULL_TR = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

/* ---------- Masthead: full bilingual "today" equation ---------- */
function renderMasthead() {
  var jsDow = today.getDay(); // 0 = Sunday ... 6 = Saturday
  var persDow = (jsDow + 1) % 7; // 0 = Saturday-start index into PERS_WD_FULL

  var faLine =
    '<span class="fa" dir="rtl">' +
      PERS_WD_FULL[persDow] + ' ' +
      toPersianDigits(todayJ.jd) + ' ' +
      PERS_MONTHS[todayJ.jm - 1] + ' ' +
      '<span class="mnum">(' + toPersianDigits(todayJ.jm) + ')</span> ' +
      toPersianDigits(todayJ.jy) +
    '</span>';

  var enLine =
    '<span class="en" dir="ltr">' +
      GREG_WD_FULL[jsDow] + ' ' +
      '<span class="tr">[' + GREG_WD_FULL_TR[jsDow] + ']</span> ' +
      todayG.d + ' ' +
      GREG_MONTHS[todayG.m] + ' ' +
      '<span class="mnum">(' + (todayG.m + 1) + ')</span> ' +
      '<span class="tr">[' + GREG_MONTHS_TR[todayG.m] + ']</span> ' +
      todayG.y +
    '</span>';

  document.getElementById('mastheadLine').innerHTML = enLine + ' <span class="eq">=</span> ' + faLine;
}

renderMasthead();
renderGreg();
renderPers();
</script>

</body>
</html>
